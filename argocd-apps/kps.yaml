# Prometheus, Alertmanager, Grafana. Grafana admin comes from Secret grafana-admin, created by hand (not in Git).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.18.0
    helm:
      valuesObject:
        fullnameOverride: kps
        # not reachable on minikube, would only show as DOWN targets and alerts
        kubeEtcd: {enabled: false}
        kubeControllerManager: {enabled: false}
        kubeScheduler: {enabled: false}
        kubeProxy: {enabled: false}
        prometheus:
          prometheusSpec:
            retention: 2d
            # pick up ServiceMonitor and PrometheusRule from every namespace, not only this release
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: {cpu: 200m, memory: 512Mi}
              limits: {memory: 1200Mi}
        alertmanager:
          alertmanagerSpec:
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 96Mi}
        prometheusOperator:
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 192Mi}
        kube-state-metrics:
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 128Mi}
        prometheus-node-exporter:
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 512Mi}
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-gateway.monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the operator CRDs are too large for client-side apply
