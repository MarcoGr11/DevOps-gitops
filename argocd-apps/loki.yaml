# Loki in single-process mode with filesystem storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 20.4.1
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
        singleBinary:
          replicas: 1
          persistence:
            size: 2Gi
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
        # other deployment modes and extras are off
        read: {replicas: 0}
        write: {replicas: 0}
        backend: {replicas: 0}
        chunksCache: {enabled: false}
        resultsCache: {enabled: false}
        lokiCanary: {enabled: false}
        test: {enabled: false}
        gateway:
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
