# Argo CD (minikube): only differences from values.yaml.
# Secret booking-secret is created in the cluster by hand, never stored in Git (see README).
existingSecret: booking-secret

image:
  api:
    repository: ghcr.io/marcogr11/devops-api
    tag: "1.5.0"
    pullPolicy: IfNotPresent
  worker:
    repository: ghcr.io/marcogr11/devops-worker
    tag: "1.1.0"
    pullPolicy: IfNotPresent

replicaCount:
  api: 5
  worker: 1

ingress:
  enabled: true
  host: dev.booking.local

hooks:
  dbCheck:
    enabled: false
tests:
  enabled: false

# report a stuck rollout (e.g. bad image tag) as Degraded after 60 s instead of 10 min
progressDeadlineSeconds: 60

metrics:
  enabled: true

# share of api requests answered with 500 (see api/booking/metrics_middleware.py)
env:
  - name: FAIL_RATE
    value: "0"

# Canary for api. No traffic router: the Service balances across pods, so weight = share of pods (20% = 1 of 5).
# The analysis step blocks the release: below 95% success it aborts by itself and returns to stable.
rollout:
  enabled: true
  analysis:
    enabled: true
    prometheusAddress: http://kps-prometheus.monitoring:9090
    selector: 'namespace="coworking-booking"'
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: booking-success-rate
        - setWeight: 60
        - pause: {duration: 30s}
