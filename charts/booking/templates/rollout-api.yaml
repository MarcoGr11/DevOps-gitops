{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "booking.fullname" . }}-api
  labels:
    {{- include "booking.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.api }}
  revisionHistoryLimit: 3
  {{- with .Values.progressDeadlineSeconds }}
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "booking.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booking.labels" (dict "ctx" $ "component" "api") | nindent 8 }}
      annotations:
        # env comes from envFrom, which is read only at container start: roll pods when it changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api
          image: {{ include "booking.image" (dict "ctx" $ "image" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "booking.fullname" . }}-config
            - secretRef:
                name: {{ include "booking.secretName" . }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/health/, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health/, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # give the Service time to drop this pod from endpoints before gunicorn stops
              exec:
                command: ["sleep", "5"]
  strategy:
    {{- toYaml .Values.rollout.strategy | nindent 4 }}
{{- end }}
