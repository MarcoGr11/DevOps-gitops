{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "booking.fullname" . }}-dashboard
  labels:
    {{- include "booking.labels" (dict "ctx" $) | nindent 4 }}
    grafana_dashboard: "1"
data:
  booking.json: |-
{{ .Files.Get "dashboards/booking.json" | indent 4 }}
{{- end }}
