{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "booking.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "booking.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  groups:
    - name: booking-api
      rules:
        - alert: MyappHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",status=~"5.."}[1m]))
            /
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[1m])) > 0.05
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "api: more than 5% of requests fail with 5xx"
{{- end }}
